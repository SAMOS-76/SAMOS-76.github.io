<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}

  <script src="{{ '/assets/js/video.js' | relative_url }}" defer></script>
  {%- if page.layout == 'home' %}
  <script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
  {%- endif %}
  {%- if page.collection == 'projects' %}
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
  {%- endif %}
  {%- if site.dev_switcher %}
  {% include theme-switcher.html %}
  {%- endif %}
</body>
</html>
