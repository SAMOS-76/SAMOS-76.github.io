# Local preview without installing Ruby:  docker compose up
# Then open http://localhost:4000  (Ctrl+C to stop)
services:
  site:
    image: ruby:3.3
    working_dir: /srv/site
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/site
      - bundle:/usr/local/bundle

volumes:
  bundle:
